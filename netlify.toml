# ==============================================================================
# Netlify Configuration for AI Knowledge Assistant Frontend
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://ai-knowledge-backend-xfdm.onrender.com"

# Reverse proxy /api to live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://ai-knowledge-backend-xfdm.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Client-Side Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
